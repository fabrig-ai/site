<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 -4 674 540" role="img" aria-labelledby="title desc">
  <title id="title">fabrig logo</title>
  <desc id="desc">A stylized factory, robot and code panel in a cyan to violet gradient.</desc>
  <defs>
    <linearGradient id="fabrig-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5df"/>
      <stop offset=".48" stop-color="#087cff"/>
      <stop offset="1" stop-color="#a000ff"/>
    </linearGradient>
    <linearGradient id="flame-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e6df"/>
      <stop offset=".55" stop-color="#087cff"/>
      <stop offset="1" stop-color="#a000ff"/>
    </linearGradient>
  </defs>
  <!-- Floating flame / motion mark -->
  <path fill="url(#flame-gradient)" d="M170 113c34-56 83-78 141-93 46-12 67-42 112-14 34 21 46 59 23 91-24 34-76 51-129 47-54-4-95-27-147-10-19 6-32 15-43 25 8-18 22-34 43-46z"/>
